<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test serveur maison</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  input { width: 100%; padding: .6rem; font-size: 1rem; box-sizing: border-box; }
  button { margin-top: .8rem; padding: .7rem 1.2rem; font-size: 1rem; border-radius: .5rem; border: 0; background: #2563eb; color: #fff; }
  #resultat { margin-top: 1.2rem; padding: 1rem; border-radius: .5rem; background: #f3f4f6; white-space: pre-wrap; }
  .ok { background: #dcfce7 !important; }
  .ko { background: #fee2e2 !important; }
</style>
</head>
<body>
<h1>Test du serveur maison</h1>
<p>Cette page vérifie qu'une PWA hébergée en HTTPS peut joindre PocketBase sur le réseau de la maison.</p>

<label for="url">Adresse du serveur</label>
<input id="url" value="http://192.168.1.63:8090">
<button id="tester">Tester</button>

<div id="resultat">Appuie sur « Tester ». Chrome peut te demander l'accès au réseau local : réponds « Autoriser ».</div>

<script>
const $res = document.getElementById('resultat');

function afficher(texte, etat) {
  $res.textContent = texte;
  $res.className = etat || '';
}

async function etatPermission() {
  try {
    const p = await navigator.permissions.query({ name: 'local-network-access' });
    return p.state; // granted, prompt ou denied
  } catch {
    return 'non gérée par ce navigateur';
  }
}

document.getElementById('tester').addEventListener('click', async () => {
  const base = document.getElementById('url').value.trim().replace(/\/+$/, '');
  afficher('Test en cours…');
  const debut = performance.now();
  try {
    const rep = await fetch(base + '/api/health', {
      cache: 'no-store',
      targetAddressSpace: 'local' // ignoré par les navigateurs qui ne le connaissent pas
    });
    const json = await rep.json().catch(() => ({}));
    const ms = Math.round(performance.now() - debut);
    if (rep.ok) {
      afficher(`✅ Serveur joint en ${ms} ms.\nRéponse : ${JSON.stringify(json)}\nPermission réseau local : ${await etatPermission()}`, 'ok');
    } else {
      afficher(`⚠️ Le serveur répond, mais avec l'erreur ${rep.status}.\nPermission réseau local : ${await etatPermission()}`, 'ko');
    }
  } catch (e) {
    afficher(
      `❌ Impossible de joindre le serveur.\nErreur : ${e.message}\nPermission réseau local : ${await etatPermission()}\n\n` +
      `À vérifier :\n• le téléphone est bien sur le Wi-Fi de la maison\n• l'adresse ${base}/api/health s'ouvre dans un onglet\n` +
      `• la permission « réseau local » n'a pas été refusée (cadenas à côté de l'adresse → Paramètres du site)`,
      'ko'
    );
  }
});
</script>
</body>
</html>
